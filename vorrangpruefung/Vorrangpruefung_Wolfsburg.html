<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vorrangprüfung Wolfsburg</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: dunkles Kopfband mit Sprachwahl; darunter geführte Eingabe (3 Schritte) links und dauerhaft sichtbares Ergebnis rechts; Fachdetails als Akkordeons. */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --surface-2:#eaf0f3; --line:#d3dde3;
  --fg:#10232c; --muted:#587078; --ink:#0d3b4a; --ink-2:#14566a; --on-ink:#f2fafc; --on-ink-muted:#a9cbd5;
  --accent:#0f6e7f; --accent-soft:#dbeef2; --gold:#e7a525; --gold-soft:#fbf0d7;
  --ok:#1f8a4c; --ok-soft:#e0f3e8; --bad:#c2413a; --bad-soft:#f9e4e2;
  --font-body:"Manrope","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:14px; --shadow:0 1px 2px rgba(13,59,74,.06),0 8px 24px rgba(13,59,74,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c171c; --surface:#13222a; --surface-2:#1a2d36; --line:#29404b;
  --fg:#e4eef2; --muted:#93abb4; --ink:#0a2a35; --ink-2:#0f3a48; --on-ink:#eef8fb; --on-ink-muted:#9cc2cd;
  --accent:#4cc3d4; --accent-soft:#163b44; --gold:#f5c25a; --gold-soft:#3b2f15;
  --ok:#5bd28c; --ok-soft:#173426; --bad:#ff8a80; --bad-soft:#3f1f1d; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c171c; --surface:#13222a; --surface-2:#1a2d36; --line:#29404b;
  --fg:#e4eef2; --muted:#93abb4; --ink:#0a2a35; --ink-2:#0f3a48; --on-ink:#eef8fb; --on-ink-muted:#9cc2cd;
  --accent:#4cc3d4; --accent-soft:#163b44; --gold:#f5c25a; --gold-soft:#3b2f15;
  --ok:#5bd28c; --ok-soft:#173426; --bad:#ff8a80; --bad-soft:#3f1f1d; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;margin:0}
.in{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Kopfband */
.hero{background:var(--ink);color:var(--on-ink);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-block-start:-120px;inset-inline-end:-120px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,transparent 38%,var(--ink-2) 39%,var(--ink-2) 52%,transparent 53%,transparent 64%,var(--ink-2) 65%,var(--ink-2) 72%,transparent 73%);opacity:.7;pointer-events:none}
.hero .in{padding-block:22px 34px;position:relative;z-index:1;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.langs{display:flex;flex-wrap:wrap;gap:6px}
.langs button{background:transparent;border:1px solid var(--on-ink-muted);color:var(--on-ink);border-radius:999px;padding:5px 12px;font-size:.85rem;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--on-ink);color:var(--ink);border-color:var(--on-ink);font-weight:700}
.hero h1{font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.15;margin:0;font-weight:800;letter-spacing:-.02em;text-wrap:balance;max-width:22ch}
.hero p{margin:0;color:var(--on-ink-muted);max-width:62ch;font-size:1.02rem}

/* Hauptbereich */
main.in{padding-block:0 56px;display:flex;flex-direction:column;gap:22px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start;margin-top:-18px;position:relative;z-index:2}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:20px;min-width:0}
@media (min-width:921px){#resCard{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}}

/* Schritte */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0;padding:0;list-style:none}
.steps button{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:none;border:0;padding:0;cursor:pointer;text-align:start;color:var(--muted);font-size:.85rem;font-weight:600}
.steps .bar{display:block;width:100%;height:5px;border-radius:9px;background:var(--surface-2)}
.steps button[aria-current="step"],.steps button.done{color:var(--fg)}
.steps button[aria-current="step"] .bar{background:var(--accent)}
.steps button.done .bar{background:var(--accent);opacity:.45}
.q{font-size:1.35rem;font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
.note{font-size:.82rem;background:var(--gold-soft);color:var(--fg);padding:8px 12px;border-radius:10px;margin:0;border-inline-start:4px solid var(--gold)}
.hint{font-size:.85rem;color:var(--muted);margin:0}
section[data-step]{display:flex;flex-direction:column;gap:18px}

.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{display:flex;gap:14px;align-items:center;text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;min-width:0}
.choice svg{flex:none;width:44px;height:44px;color:var(--accent)}
.choice b{display:block;font-size:1.02rem}
.choice span{display:block;font-size:.82rem;color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:440px){.choices{grid-template-columns:minmax(0,1fr)}}

.sub{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.kids{display:flex;flex-direction:column;gap:10px}
.kid{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.2fr) auto;gap:12px;align-items:end;background:var(--surface-2);border-radius:12px;padding:12px}
@media (max-width:560px){.kid{grid-template-columns:auto minmax(0,1fr) auto}.kid .money-l{grid-column:1 / -1}}
.kid .av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--surface);display:grid;place-items:center;font-weight:800;align-self:center}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:none;width:40px;font-size:1.2rem;cursor:pointer;color:var(--accent);font-weight:700}
.stepper input{border:0;text-align:center;width:100%;min-width:0;padding:9px 0;background:transparent;font-weight:700;font-variant-numeric:tabular-nums}
.icon-btn{background:none;border:0;cursor:pointer;color:var(--muted);padding:8px;border-radius:8px;align-self:center}
.icon-btn:hover{color:var(--bad);background:var(--bad-soft)}
.add{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);background:none;border-radius:12px;padding:12px;cursor:pointer;color:var(--accent);font-weight:700;width:100%}
.add:hover{border-color:var(--accent);background:var(--accent-soft)}

label.f{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:600;min-width:0}
.money{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.money:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.money input{border:0;outline:0;background:transparent;padding:11px 12px;width:100%;min-width:0;font-size:1.05rem;font-weight:600;font-variant-numeric:tabular-nums}
.money span{padding-inline:12px;color:var(--muted);font-weight:700}
select.sel{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:11px 12px;width:100%}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:440px){.pair{grid-template-columns:minmax(0,1fr)}}
.person{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:var(--surface-2)}
.person h4{margin:0;font-size:.95rem}
.toggle{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;background:var(--surface-2);cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:2px}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.btn{border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{border:0;background:none;color:var(--muted);padding-inline:6px;font-weight:600}
.btn[hidden]{display:none}

/* Ergebnis */
.res-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.res-head h2{margin:0;font-size:1.1rem}
.verdict{display:flex;gap:14px;padding:16px;border-radius:12px;border:2px solid transparent}
.verdict svg{flex:none;width:34px;height:34px}
.verdict b{display:block;font-size:1.15rem;line-height:1.3;margin-bottom:4px}
.verdict p{margin:0}
.verdict .law{font-size:.78rem;color:var(--muted);margin-top:6px}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok)} .verdict.ok svg{color:var(--ok)}
.verdict.warn{background:var(--gold-soft);border-color:var(--gold)} .verdict.warn svg{color:var(--gold)}
.verdict.bad{background:var(--bad-soft);border-color:var(--bad)} .verdict.bad svg{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:480px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{border-radius:12px;padding:12px 14px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:.78rem;color:var(--muted);font-weight:600}
.kpi b{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi.wg b,.kpi.kz b{color:var(--accent)}
.bars{display:flex;flex-direction:column;gap:14px}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.bh h3{margin:0;font-size:.95rem}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.vrow{display:flex;flex-direction:column;gap:6px}
.vtop{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.9rem}
.vtop b{font-weight:700}
.track{position:relative;display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.seg-own{background:var(--accent)} .seg-ben{background:var(--gold)}
.seg-gap{background:repeating-linear-gradient(45deg,var(--bad-soft) 0 5px,transparent 5px 10px);box-shadow:inset 0 0 0 1px var(--bad)}
.vrow.best{background:var(--accent-soft);margin-inline:-10px;padding:8px 10px;border-radius:10px}
.pill{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.na{background:var(--surface-2);color:var(--muted)}
.amt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem}
.budget{font-size:.88rem;color:var(--muted);margin:0;padding-top:4px;border-top:1px solid var(--line)}
.budget b{color:var(--fg);font-variant-numeric:tabular-nums}

/* Akkordeons */
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
summary{cursor:pointer;padding:16px 22px;font-weight:700;list-style-position:inside}
.dbody{padding:0 22px 22px;display:flex;flex-direction:column;gap:16px}
.dbody h3{font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.sum td{font-weight:800;border-top:2px solid var(--line)}
.formula{font-family:var(--font-mono);font-size:.8rem;background:var(--surface-2);padding:10px 12px;border-radius:8px;overflow-x:auto;direction:ltr;text-align:left}
.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.pg{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pg h4{margin:0;font-size:.92rem}
.pg .src{font-size:.75rem;color:var(--muted)}
.pg .w{font-size:.78rem;background:var(--gold-soft);padding:5px 9px;border-radius:6px}
.pr{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;align-items:center;font-size:.84rem}
.pr input{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-family:var(--font-mono);font-size:.8rem;text-align:end;background:var(--surface);width:100%}
.pr.ch input{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
ul.notes{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;max-width:80ch}
footer{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.track>div{transition:width .45s cubic-bezier(.2,.7,.2,1)}.choice,.verdict{transition:background-color .2s,border-color .2s}}
</style>
</head>
<body>

<header class="hero">
  <div class="in">
    <div class="topbar">
      <span class="tag" data-i18n="tag"></span>
      <div class="langs" id="langs" role="group" aria-label="Sprache / Language"></div>
    </div>
    <h1 data-i18n="title"></h1>
    <p data-i18n="sub"></p>
  </div>
</header>

<main class="in">
  <div class="grid">
    <!-- Geführte Eingabe -->
    <form class="card" id="f" autocomplete="off">
      <ol class="steps" id="steps"></ol>
      <p class="note" data-i18n="example"></p>

      <section data-step="1">
        <h2 class="q" data-i18n="q1"></h2>
        <div class="choices">
          <button type="button" class="choice" data-typ="paar">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="17" cy="15" r="6"/><circle cx="31" cy="15" r="6"/><path d="M5 41c0-7 5-12 12-12s12 5 12 12"/><path d="M19 41c0-7 5-12 12-12s12 5 12 12"/></svg>
            <div><b data-i18n="couple"></b><span data-i18n="coupleD"></span></div>
          </button>
          <button type="button" class="choice" data-typ="ae">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="18" cy="13" r="6"/><path d="M6 41c0-8 5-14 12-14s12 6 12 14"/><circle cx="36" cy="23" r="4"/><path d="M29 41c0-5 3-9 7-9s7 4 7 9"/></svg>
            <div><b data-i18n="single"></b><span data-i18n="singleD"></span></div>
          </button>
        </div>
        <p class="sub" data-i18n="kids"></p>
        <div class="kids" id="kids"></div>
        <button type="button" class="add" id="addKid"><span aria-hidden="true">＋</span><span data-i18n="addKid"></span></button>
      </section>

      <section data-step="2" hidden>
        <h2 class="q" data-i18n="q2"></h2>
        <div class="person">
          <h4 data-i18n-adult="1"></h4>
          <div class="pair">
            <label class="f"><span data-i18n="gross"></span><div class="money"><input id="b1" type="number" inputmode="decimal" min="0" step="any"><span>€</span></div></label>
            <label class="f"><span data-i18n="net"></span><div class="money"><input id="n1" type="number" inputmode="decimal" min="0" step="any"><span>€</span></div></label>
          </div>
        </div>
        <div class="person" id="p2">
          <h4 data-i18n-adult="2"></h4>
          <div class="pair">
            <label class="f"><span data-i18n="gross"></span><div class="money"><input id="b2" type="number" inputmode="decimal" min="0" step="any"><span>€</span></div></label>
            <label class="f"><span data-i18n="net"></span><div class="money"><input id="n2" type="number" inputmode="decimal" min="0" step="any"><span>€</span></div></label>
          </div>
        </div>
        <p class="hint" data-i18n="grossHint"></p>
        <label class="f"><span data-i18n="job"></span>
          <select class="sel" id="pa">
            <option value="0.3" data-i18n="job3"></option>
            <option value="0.2" data-i18n="job2"></option>
            <option value="0.1" data-i18n="job1"></option>
            <option value="0" data-i18n="job0"></option>
          </select></label>
        <label class="f"><span data-i18n="other"></span><div class="money"><input id="so" type="number" inputmode="decimal" min="0" step="any"><span>€</span></div></label>
      </section>

      <section data-step="3" hidden>
        <h2 class="q" data-i18n="q3"></h2>
        <div class="pair">
          <label class="f"><span data-i18n="rent"></span><div class="money"><input id="mi" type="number" inputmode="decimal" min="0" step="any"><span>€</span></div></label>
          <label class="f"><span data-i18n="heat"></span><div class="money"><input id="hz" type="number" inputmode="decimal" min="0" step="any"><span>€</span></div></label>
        </div>
        <p class="hint" data-i18n="rentHint"></p>
        <label class="toggle"><input type="checkbox" id="ka"><span data-i18n="karenz"></span></label>
      </section>

      <div class="nav">
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          <button type="button" class="btn ghost" id="exBtn" data-i18n="exampleBtn"></button>
          <button type="button" class="btn ghost" id="rsBtn" data-i18n="resetBtn"></button>
        </div>
        <div style="display:flex;gap:8px">
          <button type="button" class="btn" id="backBtn" data-i18n="back"></button>
          <button type="button" class="btn primary" id="nextBtn"></button>
        </div>
      </div>
    </form>

    <!-- Ergebnis -->
    <section class="card" id="resCard" aria-live="polite">
      <div class="res-head"><h2 data-i18n="result"></h2></div>
      <div id="verdict"></div>
      <div class="kpis" id="kpis"></div>
      <div class="bars">
        <div class="bh"><h3 data-i18n="compare"></h3>
          <div class="legend" id="legend"></div></div>
        <div id="vrows" class="bars"></div>
      </div>
      <p class="budget" id="budget"></p>
    </section>
  </div>

  <details id="dWeg"><summary data-i18n="calc"></summary><div class="dbody" id="weg"></div></details>

  <details id="dPar"><summary data-i18n="params"></summary>
    <div class="dbody">
      <p class="hint" id="paramsDe"></p>
      <div class="toolbar">
        <button type="button" class="btn" id="resetP" data-i18n="resetP"></button>
        <button type="button" class="btn" id="copyP" data-i18n="copyP"></button>
        <span class="hint" id="copyMsg"></span>
      </div>
      <p class="hint" data-i18n="paramsNote"></p>
      <div class="params" id="params"></div>
      <textarea id="copyBox" hidden readonly style="width:100%;height:120px;font-family:var(--font-mono);font-size:.75rem"></textarea>
    </div>
  </details>

  <details><summary data-i18n="limits"></summary><div class="dbody"><ul class="notes" id="limits"></ul></div></details>

  <footer data-i18n="footer"></footer>
</main>

<script>
(function(){
"use strict";
/* ================= Übersetzungen ================= */
const LANGS = [["de","Deutsch","de-DE"],["en","English","en-GB"],["tr","Türkçe","tr-TR"],["ar","العربية","ar-u-nu-latn"],["uk","Українська","uk-UA"],["ru","Русский","ru-RU"]];
const I = {
de:{wg:"Wohngeld",kiz:"Kinderzuschlag",tag:"Prototyp · Ideenmanagement",title:"Vorrangprüfung Wolfsburg",

function rbKind(age){ if(age>=18) return P.rb.u25; if(age>=14) return P.rb.k14; if(age>=6) return P.rb.k6; return P.rb.k0; }
function byN(arr, plus, n){ const i = Math.min(n,arr.length)-1; return arr[i] + Math.max(0,n-arr.length)*plus; }
function freibetrag(brutto, mitKind){
  if(brutto<=0) return 0; const f = P.fb;
  let fb = Math.min(brutto, f.grund);
  fb += f.q1*clamp(brutto-f.grund,0,f.g1-f.grund);
  fb += f.q2*clamp(brutto-f.g1,0,f.g2-f.g1);
  fb += f.q3*clamp(brutto-f.g2,0,(mitKind?f.g3m:f.g3o)-f.g2);
  return fb;
}
function grund(H){
  const ae = H.typ==="ae";
  const kids = H.kids.filter(k=>k.age>=0 && k.age<25);
  const nAd = ae?1:2, n = nAd+kids.length;
  const earners = ae ? [{b:H.b1,n:H.n1}] : [{b:H.b1,n:H.n1},{b:H.b2,n:H.n2}];
  const eink = earners.map(e=>{ const fb=freibetrag(e.b,kids.length>0); return {b:e.b,n:e.n,fb,ber:Math.max(0,e.n-fb)}; });
  const sonstBer = H.so>0 ? Math.max(0,H.so-P.fb.pausch) : 0;
  const elternEink = eink.reduce((s,e)=>s+e.ber,0)+sonstBer;
  let mbPct = 0;
  if(ae){ const m = kids.filter(k=>k.age<18), u7=m.filter(k=>k.age<7).length, u16=m.filter(k=>k.age<16).length;
    mbPct = m.length ? Math.max((u7>=1||u16>=2)?36:0, Math.min(60,12*m.length)) : 0; }
  const mb = Math.round(P.rb.single*mbPct)/100;
  const rbEltern = ae ? P.rb.single : 2*P.rb.partner;
  const grenze = byN(P.kdu.p,P.kdu.plus,n);
  const mieteAnerk = H.ka ? Math.min(H.mi,grenze*P.kdu.karenz) : Math.min(H.mi,grenze);
  const kdu = mieteAnerk+H.hz;
  return {ae,kids,nAd,n,eink,sonstBer,elternEink,mbPct,mb,rbEltern,grenze,mieteAnerk,kdu,kopf:kdu/n};
}
function sgb2(G, x){
  const wgShare = (x.wg||0)/G.n; let kgSurplus=0, childGap=0;
  G.kids.forEach((k,i)=>{
    const need = rbKind(k.age)+G.kopf, own = k.uh+(x.kiz?x.kiz[i]:0)+wgShare;
    if(own>=need){ kgSurplus+=P.kindergeld; }
    else { const rem=need-own, used=Math.min(P.kindergeld,rem); kgSurplus+=P.kindergeld-used; childGap+=rem-used; }
  });
  const pGap = (G.rbEltern+G.mb+G.kopf*G.nAd) - (G.elternEink+kgSurplus+wgShare*G.nAd);
  return {gap: Math.max(0, Math.round((pGap+childGap)*100)/100)};
}
function wohngeld(G,H){
  const n=G.n, hb=byN(P.wg.hb,P.wg.hbPlus,n), kl=byN(P.wg.klima,P.wg.klimaPlus,n), hke=byN(P.wg.hke,P.wg.hkePlus,n), hkk=byN(P.wg.hkk,P.wg.hkkPlus,n);
  const cap=hb+kl, mRent=Math.min(H.mi,cap), M=mRent+hke+hkk, pa=num(H.pa);
  let jahr=0; const rows=[];
  G.eink.forEach((e,i)=>{ if(e.b>0){ const j=e.b*12, wk=Math.min(j,P.wg.wk), v=(j-wk)*(1-pa); jahr+=v; rows.push([t("earnY",{n:i+1}),j,wk,v]); } });
  if(H.so>0){ const j=H.so*12; jahr+=j; rows.push([t("otherY"),j,0,j]); }
  G.kids.forEach((k,i)=>{ if(k.uh>0){ const j=k.uh*12; jahr+=j; rows.push([t("maintY",{n:i+1}),j,0,j]); } });
  const frei = G.ae ? G.kids.filter(k=>k.age<18).length*P.wg.aeFrei : 0;
  const Y = Math.max(0,jahr-frei)/12;
  const idx=Math.min(n,12)-1, a=P.wg.a[idx], b=P.wg.b[idx], c=P.wg.c[idx];
  const raw = 1.15*(M-(a+b*M+c*Y)*Y);
  let wg = Math.round(Math.max(0,Math.min(raw,M)));
  const unterMin = wg>0 && wg<P.wg.min; if(wg<P.wg.min) wg=0;
  return {wg,raw,M,mRent,cap,hb,kl,hke,hkk,Y,frei,rows,a,b,c,pa,unterMin};
}
function kinderzuschlag(G,H){
  const r = {kiz:0, perChild:G.kids.map(()=>0), reason:"", st:null};
  if(!G.kids.length){ r.reason=t("rNoKids"); return r; }
  const brutto = G.eink.reduce((s,e)=>s+e.b,0)+H.so, minE = G.ae?P.kiz.minAE:P.kiz.minPaar;
  if(brutto<minE){ r.reason=t("rMin",{x:eur(minE)}); return r; }
  const tab = G.ae?P.kiz.ae:P.kiz.paar, anteil = tab[Math.min(G.kids.length,tab.length)-1]/100;
  const bedarf = G.rbEltern+G.mb+anteil*G.kdu, excess = Math.max(0,G.elternEink-bedarf);
  const base = G.kids.map(k=>Math.max(0,P.kiz.max-P.kiz.quote*k.uh)), baseSum = base.reduce((s,x)=>s+x,0);
  const minderung = P.kiz.quote*excess, total = Math.max(0,Math.floor(baseSum-minderung));
  r.perChild = baseSum>0 ? base.map(x=>total*x/baseSum) : base.map(()=>0);
  r.kiz = total; if(!total) r.reason = t("rExcess");
  r.st = {brutto,minE,anteil,bedarf,eink:G.elternEink,excess,baseSum,minderung};
  return r;
}
function berechne(H){
  const G=grund(H), W=wohngeld(G,H), K=kinderzuschlag(G,H);
  const s0=sgb2(G,{}), s1=sgb2(G,{wg:W.wg}), s2=sgb2(G,{kiz:K.perChild}), s3=sgb2(G,{wg:W.wg,kiz:K.perChild});
  const need = G.rbEltern+G.mb+G.kdu+G.kids.reduce((s,k)=>s+rbKind(k.age),0);
  const basis = G.eink.reduce((s,e)=>s+e.n,0)+H.so+G.kids.reduce((s,k)=>s+k.uh,0)+G.kids.length*P.kindergeld;
  return {G,W,K,s0,s1,s2,s3,need,basis};
}

function renderWeg(R){
  const {G,W,K,s0}=R; let h="";
  h+='<h3>'+esc(t("rw1"))+'</h3>';
  const r1=[[t("rbP"),G.rbEltern]]; if(G.mb>0) r1.push([t("mbAE",{p:G.mbPct}),G.mb]);
  r1.push([t("rentR",{g:eur(S.ka?G.grenze*P.kdu.karenz:G.grenze)}),G.mieteAnerk],[t("heatR"),S.hz]);
  G.kids.forEach((k,i)=>r1.push([t("rbC",{n:i+1,a:k.age}),rbKind(k.age)]));
  h+=tbl([t("colNeed"),t("colEur")],r1,[t("totNeed"),R.need]);
  const r2=G.eink.filter(e=>e.b>0||e.n>0).map((e,i)=>[t("earnR",{n:i+1,a:eur(e.n),b:eur(e.fb)}),e.ber]);
  if(G.sonstBer>0) r2.push([t("otherR",{a:eur(P.fb.pausch)}),G.sonstBer]);
  G.kids.forEach((k,i)=>{ if(k.uh>0) r2.push([t("maintR",{n:i+1}),k.uh]); });
  r2.push([t("kgR",{n:G.kids.length,a:eur(P.kindergeld)}),G.kids.length*P.kindergeld]);
  h+=tbl([t("colInc"),t("colEur")],r2,[t("gapR"),s0.gap]);
  h+='<p class="hint">'+esc(t("kopf",{a:eur(G.kopf)}))+'</p>';
  h+='<h3>'+esc(t("rw2",{n:G.n}))+'</h3>';
  h+=tbl([t("colM"),t("colEur")],[[t("hbR",{a:eur(W.hb),b:eur(W.kl)}),W.cap],[t("capR"),W.mRent],[t("hkeR"),W.hke],[t("hkkR"),W.hkk]],["M",W.M]);
  h+=tbl([t("colY"),t("colGross"),t("colWk"),t("colAfter")],W.rows.concat(W.frei>0?[[t("aeY"),"","",-W.frei]]:[]),[t("yR",{p:pct(W.pa)}),"","",W.Y]);
  h+='<div class="formula">1,15 · ('+W.M.toFixed(2)+' − ('+W.a+' + '+W.b+'·'+W.M.toFixed(2)+' + '+W.c+'·'+W.Y.toFixed(2)+') · '+W.Y.toFixed(2)+') = '+W.raw.toFixed(2)+' → <b>'+eur(W.wg)+'</b>'+(W.unterMin?' ('+esc(t("rBelow"))+')':'')+'</div>';
  h+='<h3>'+esc(t("rw3"))+'</h3>';
  if(!K.st) h+='<p class="hint">'+esc(K.reason)+'</p>';
  else { const s=K.st;
    h+=tbl([t("colStep"),t("colEur")],[[t("kGross",{a:eur(s.minE)}),s.brutto],[t("kNeed",{p:Math.round(s.anteil*100)}),s.bedarf],[t("kInc"),s.eink],[t("kEx"),s.excess],[t("kBase"),s.baseSum],[t("kMinus"),s.minderung>0?-s.minderung:0]],[t("kTot"),K.kiz]); }
  h+='<h3>'+esc(t("rw4"))+'</h3>';
  h+=tbl([t("colVar"),t("colGap")],[[t("v0"),R.s0.gap],[t("v1"),R.s1.gap],[t("v2"),R.s2.gap],[t("v3"),R.s3.gap]]);
  h+='<p class="hint">'+esc(t("rw4h"))+'</p>';
  $("weg").innerHTML=h;
}
function renderParams(){
  const box=$("params"); box.innerHTML="";
  GROUPS.forEach(g=>{
    let items=g.items||[];
    if(g.abc){ items=[]; for(let i=0;i<12;i++) ["a","b","c"].forEach(x=>items.push(["wg."+x+"."+i, x+" · "+(i+1)+" Pers."])); }
    const d=document.createElement("div"); d.className="pg"; d.lang="de"; d.dir="ltr";
    d.innerHTML='<h4>'+esc(g.t)+'</h4><div class="src">Quelle: '+esc(g.src)+'</div>'+(g.warn?'<div class="w">'+esc(g.warn)+'</div>':"")+
      items.map(([p,l])=>{ const v=getP(P,p); return '<div class="pr'+(v!==getP(DEFAULTS,p)?' ch':'')+'"><label for="p_'+p+'">'+esc(l)+'</label><input id="p_'+p+'" data-p="'+p+'" type="text" inputmode="decimal" value="'+String(v).replace(".",",")+'"></div>'; }).join("");
    box.appendChild(d);
  });
  box.querySelectorAll("input[data-p]").forEach(inp=>inp.addEventListener("change",()=>{
    const p=inp.dataset.p, v=num(inp.value); setP(P,p,v);
    inp.parentElement.classList.toggle("ch", v!==getP(DEFAULTS,p));
    try{ localStorage.setItem("vp-wob-params",JSON.stringify(P)); }catch(e){}
    update();
  }));
}
$("resetP").addEventListener("click",()=>{ P=clone(DEFAULTS); try{ localStorage.removeItem("vp-wob-params"); }catch(e){} renderParams(); update(); });
$("copyP").addEventListener("click",()=>{
  const txt=JSON.stringify(P,null,2);
  const fb=()=>{ const ta=$("copyBox"); ta.hidden=false; ta.value=txt; ta.select(); $("copyMsg").textContent=t("selectCopy"); };
  try{ navigator.clipboard.writeText(txt).then(()=>{ $("copyMsg").textContent=t("copied"); },fb); }catch(e){ fb(); }
});

function renderAll(){ renderLangs(); applyStatic(); renderKids(); showStep(); update(); }
bind(); fillForm(); renderParams(); renderAll();
})();
</script>
