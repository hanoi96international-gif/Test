<title>Vorrangprüfung Wolfsburg</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: dunkles Kopfband mit Sprachwahl; darunter geführte Eingabe (3 Schritte) links und dauerhaft sichtbares Ergebnis rechts; Fachdetails als Akkordeons. */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --surface-2:#eaf0f3; --line:#d3dde3;
  --fg:#10232c; --muted:#587078; --ink:#0d3b4a; --ink-2:#14566a; --on-ink:#f2fafc; --on-ink-muted:#a9cbd5;
  --accent:#0f6e7f; --accent-soft:#dbeef2; --gold:#e7a525; --gold-soft:#fbf0d7;
  --ok:#1f8a4c; --ok-soft:#e0f3e8; --kv:#7b5cd6; --kv-soft:#ece6fb; --bad:#c2413a; --bad-soft:#f9e4e2;
  --font-body:"Manrope","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:14px; --shadow:0 1px 2px rgba(13,59,74,.06),0 8px 24px rgba(13,59,74,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c171c; --surface:#13222a; --surface-2:#1a2d36; --line:#29404b;
  --fg:#e4eef2; --muted:#93abb4; --ink:#0a2a35; --ink-2:#0f3a48; --on-ink:#eef8fb; --on-ink-muted:#9cc2cd;
  --accent:#4cc3d4; --accent-soft:#163b44; --gold:#f5c25a; --gold-soft:#3b2f15;
  --ok:#5bd28c; --ok-soft:#173426; --kv:#b9a2ff; --kv-soft:#2a2342; --bad:#ff8a80; --bad-soft:#3f1f1d; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c171c; --surface:#13222a; --surface-2:#1a2d36; --line:#29404b;
  --fg:#e4eef2; --muted:#93abb4; --ink:#0a2a35; --ink-2:#0f3a48; --on-ink:#eef8fb; --on-ink-muted:#9cc2cd;
  --accent:#4cc3d4; --accent-soft:#163b44; --gold:#f5c25a; --gold-soft:#3b2f15;
  --ok:#5bd28c; --ok-soft:#173426; --kv:#b9a2ff; --kv-soft:#2a2342; --bad:#ff8a80; --bad-soft:#3f1f1d; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;margin:0}
.in{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Kopfband */
.hero{background:var(--ink);color:var(--on-ink);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-block-start:-120px;inset-inline-end:-120px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,transparent 38%,var(--ink-2) 39%,var(--ink-2) 52%,transparent 53%,transparent 64%,var(--ink-2) 65%,var(--ink-2) 72%,transparent 73%);opacity:.7;pointer-events:none}
.hero .in{padding-block:22px 34px;position:relative;z-index:1;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.langs{display:flex;flex-wrap:wrap;gap:6px}
.langs button{background:transparent;border:1px solid var(--on-ink-muted);color:var(--on-ink);border-radius:999px;padding:5px 12px;font-size:.85rem;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--on-ink);color:var(--ink);border-color:var(--on-ink);font-weight:700}
.hero h1{font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.15;margin:0;font-weight:800;letter-spacing:-.02em;text-wrap:balance;max-width:22ch}
.hero p{margin:0;color:var(--on-ink-muted);max-width:62ch;font-size:1.02rem}

/* Hauptbereich */
main.in{padding-block:0 56px;display:flex;flex-direction:column;gap:22px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start;margin-top:-18px;position:relative;z-index:2}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:20px;min-width:0}
@media (min-width:921px){#resCard{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}}

/* Schritte */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0;padding:0;list-style:none}
.steps button{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:none;border:0;padding:0;cursor:pointer;text-align:start;color:var(--muted);font-size:.85rem;font-weight:600}
.steps .bar{display:block;width:100%;height:5px;border-radius:9px;background:var(--surface-2)}
.steps button[aria-current="step"],.steps button.done{color:var(--fg)}
.steps button[aria-current="step"] .bar{background:var(--accent)}
.steps button.done .bar{background:var(--accent);opacity:.45}
.q{font-size:1.35rem;font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
.note{font-size:.82rem;background:var(--gold-soft);color:var(--fg);padding:8px 12px;border-radius:10px;margin:0;border-inline-start:4px solid var(--gold)}
.hint{font-size:.85rem;color:var(--muted);margin:0}
section[data-step]{display:flex;flex-direction:column;gap:18px}

.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{display:flex;gap:14px;align-items:center;text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;min-width:0}
.choice svg{flex:none;width:44px;height:44px;color:var(--accent)}
.choice b{display:block;font-size:1.02rem}
.choice span{display:block;font-size:.82rem;color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:440px){.choices{grid-template-columns:minmax(0,1fr)}}

.sub{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.kids{display:flex;flex-direction:column;gap:10px}
.kid{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.2fr) auto;gap:12px;align-items:end;background:var(--surface-2);border-radius:12px;padding:12px}
@media (max-width:560px){.kid{grid-template-columns:auto minmax(0,1fr) auto}.kid .money-l{grid-column:1 / -1}}
.kid .av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--surface);display:grid;place-items:center;font-weight:800;align-self:center}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:none;width:40px;font-size:1.2rem;cursor:pointer;color:var(--accent);font-weight:700}
.stepper input{border:0;text-align:center;width:100%;min-width:0;padding:9px 0;background:transparent;font-weight:700;font-variant-numeric:tabular-nums}
.icon-btn{background:none;border:0;cursor:pointer;color:var(--muted);padding:8px;border-radius:8px;align-self:center}
.icon-btn:hover{color:var(--bad);background:var(--bad-soft)}
.add{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);background:none;border-radius:12px;padding:12px;cursor:pointer;color:var(--accent);font-weight:700;width:100%}
.add:hover{border-color:var(--accent);background:var(--accent-soft)}

label.f{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:600;min-width:0}
.money{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.money:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.money input{border:0;outline:0;background:transparent;padding:11px 12px;width:100%;min-width:0;font-size:1.05rem;font-weight:600;font-variant-numeric:tabular-nums}
.money span{padding-inline:12px;color:var(--muted);font-weight:700}
.sel{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:11px 12px;width:100%}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:440px){.pair{grid-template-columns:minmax(0,1fr)}}
.person{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:var(--surface-2)}
.person h4{margin:0;font-size:.95rem}
.toggle{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;background:var(--surface-2);cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:2px}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.btn{border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{border:0;background:none;color:var(--muted);padding-inline:6px;font-weight:600}
.btn[hidden]{display:none}

/* Ergebnis */
.res-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.res-head h2{margin:0;font-size:1.1rem}
.verdict{display:flex;gap:14px;padding:16px;border-radius:12px;border:2px solid transparent}
.verdict svg{flex:none;width:34px;height:34px}
.verdict b{display:block;font-size:1.15rem;line-height:1.3;margin-bottom:4px}
.verdict p{margin:0}
.verdict .law{font-size:.78rem;color:var(--muted);margin-top:6px}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok)} .verdict.ok svg{color:var(--ok)}
.verdict.warn{background:var(--gold-soft);border-color:var(--gold)} .verdict.warn svg{color:var(--gold)}
.verdict.bad{background:var(--bad-soft);border-color:var(--bad)} .verdict.bad svg{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{border-radius:12px;padding:12px 14px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:.78rem;color:var(--muted);font-weight:600}
.kpi b{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi.wg b,.kpi.kz b{color:var(--accent)}
.bars{display:flex;flex-direction:column;gap:14px}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.bh h3{margin:0;font-size:.95rem}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.vrow{display:flex;flex-direction:column;gap:6px}
.vtop{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:.9rem}
.vtop b{font-weight:700}
.track{position:relative;display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.seg-own{background:var(--accent)} .seg-ben{background:var(--gold)}
.seg-gap{background:repeating-linear-gradient(45deg,var(--bad-soft) 0 5px,transparent 5px 10px);box-shadow:inset 0 0 0 1px var(--bad)}
.vrow.best{background:var(--accent-soft);margin-inline:-10px;padding:8px 10px;border-radius:10px}
.pill{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.na{background:var(--surface-2);color:var(--muted)}
.amt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem}
.budget{font-size:.88rem;color:var(--muted);margin:0;padding-top:4px;border-top:1px solid var(--line)}
.budget b{color:var(--fg);font-variant-numeric:tabular-nums}

.seg-zus{background:var(--kv)}
.pill.zus{background:var(--kv-soft);color:var(--kv)}
.kpi.kv b{color:var(--kv)}
.budgetbox{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.budgetbox h3{margin:0;font-size:.95rem}
.brow{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.brow b{font-variant-numeric:tabular-nums;font-size:1.05rem;white-space:nowrap}
.brow small{display:block;color:var(--muted);font-size:.78rem}
.brow.diff{border-top:1px dashed var(--line);padding-top:8px}
.brow.diff b.pos{color:var(--ok)} .brow.diff b.neg{color:var(--bad)}
#mogWarn{background:var(--surface);border-inline-start-color:var(--accent)}
.warnchip{font-size:.82rem;background:var(--gold-soft);border-inline-start:4px solid var(--gold);padding:7px 10px;border-radius:8px;margin:0}
.kvsel{font-size:.88rem;padding:9px 10px}

.choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:620px){.choices.three{grid-template-columns:minmax(0,1fr)}}
.choice[hidden]{display:none}
.checks{display:flex;flex-direction:column;gap:8px}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.ck input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}
details.more{border:1px dashed var(--line);border-radius:12px;box-shadow:none}
details.more summary{padding:12px 14px;font-weight:600;font-size:.92rem}
details.more .checks{padding:0 14px 14px}
.chipline{margin:0;font-size:.82rem;color:var(--muted)} .chipline b{color:var(--fg)}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{font-size:.82rem;padding:7px 10px;border-radius:8px;background:var(--surface-2);margin:0}
.chip.sys{background:var(--accent-soft);font-weight:700}
.chip.w{background:var(--gold-soft);border-inline-start:4px solid var(--gold)}
.steps{grid-template-columns:repeat(4,minmax(0,1fr))}

.kz-list{margin:0;padding:0 14px 0 34px;display:flex;flex-direction:column;gap:7px;font-size:.9rem}
html[dir="rtl"] .kz-list{padding:0 34px 0 14px}
.kz-key{font-weight:700}
.kz-ex{margin:10px 14px 14px;font-size:.85rem;background:var(--surface);border-radius:8px;padding:10px 12px;color:var(--muted)}
.kzres{display:flex;flex-direction:column;gap:8px}
.kzres:empty{display:none}
.kzres p{margin:0;font-size:.9rem}
.kzbox{background:var(--surface);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;border-inline-start:4px solid var(--accent)}
.kzbox.no{border-inline-start-color:var(--gold)}
.kzbar{height:10px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.kzbar i{display:block;height:100%;background:var(--accent)}
.kzmeta{font-size:.78rem;color:var(--muted)}

.copywrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn.small{padding:7px 12px;font-size:.85rem;display:inline-flex;align-items:center;gap:6px}
#copyResBox{width:100%;height:160px;font-family:var(--font-mono);font-size:.75rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.res-head{flex-wrap:wrap}
.mbar{position:fixed;inset:auto 0 0 0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--ink);color:var(--on-ink);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -6px 20px rgba(0,0,0,.18)}
.mbar span{font-size:.88rem;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mbar .btn{flex:none}
@media (min-width:921px){.mbar{display:none!important}}
@media (max-width:920px){main.in{padding-bottom:96px}}

/* Akkordeons */
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
summary{cursor:pointer;padding:16px 22px;font-weight:700;list-style-position:inside}
.dbody{padding:0 22px 22px;display:flex;flex-direction:column;gap:16px}
.dbody h3{font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.sum td{font-weight:800;border-top:2px solid var(--line)}
.formula{font-family:var(--font-mono);font-size:.8rem;background:var(--surface-2);padding:10px 12px;border-radius:8px;overflow-x:auto;direction:ltr;text-align:left}
.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.pg{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pg h4{margin:0;font-size:.92rem}
.pg .src{font-size:.75rem;color:var(--muted)}
.pg .w{font-size:.78rem;background:var(--gold-soft);padding:5px 9px;border-radius:6px}
.pr{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;align-items:center;font-size:.84rem}
.pr input{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-family:var(--font-mono);font-size:.8rem;text-align:end;background:var(--surface);width:100%}
.pr.ch input{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
ul.notes{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;max-width:80ch}
footer{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.track>div{transition:width .45s cubic-bezier(.2,.7,.2,1)}.choice,.verdict{transition:background-color .2s,border-color .2s}}
</style>

</header>

<main class="in">
  <div class="grid">

            <div><b data-i18n="modeFam"></b><span data-i18n="modeFamD"></span></div>

          <button type="button" class="choice" data-mode="wg">

            <div><b data-i18n="modeWg"></b><span data-i18n="modeWgD"></span></div>
          </button>
        </div>

        <h2 class="q" data-i18n="q1"></h2>
        <div class="choices three">
          <button type="button" class="choice" data-typ="solo" id="typSolo">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="24" cy="15" r="7"/><path d="M10 42c0-9 6-15 14-15s14 6 14 15"/></svg>
            <div><b data-i18n="solo"></b><span data-i18n="soloD"></span></div>
          </button>
          <button type="button" class="choice" data-typ="paar">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="17" cy="15" r="6"/><circle cx="31" cy="15" r="6"/><path d="M5 41c0-7 5-12 12-12s12 5 12 12"/><path d="M19 41c0-7 5-12 12-12s12 5 12 12"/></svg>

kzCalcH:"Karenzzeit für diesen Fall berechnen",kzStart:"Beginn des aktuellen Leistungsbezugs (Monat)",kzPrev:"Ende eines früheren Leistungsbezugs (falls vorhanden)",kzGap:"Volle Monate ohne Leistung seit Beginn",kzUsed:"Schon verbrauchte Karenzmonate aus dem früheren Bezug",
kzNew:"Neue Karenzzeit: 12 Monate ab {m}.",kzNewGap:"Seit dem früheren Bezug sind {x} Monate ohne Leistung vergangen – mindestens 36, also beginnt die Karenzzeit von vorne.",
kzNoNew:"Keine neue Karenzzeit: Zwischen dem früheren Bezug und jetzt liegen nur {x} Monate ohne Leistung (nötig: 36). Es laufen nur die restlichen {r} Monate weiter.",kzUsedHint:"Ohne Angabe wird angenommen, dass die frühere Karenzzeit ganz verbraucht ist.",

en:{kzTitle:"Waiting period (Karenzzeit)",kzWhat:"Explained simply: what is the waiting period?",
kz1:"In the first 12 months of receiving benefits, the Jobcenter pays the actual rent – even above the rent limit. Since 1 Jul 2026, however, at most 150 % of the rent limit.",
kz2:"Heating costs are not protected. They are checked for appropriateness from the first month.",
kz3:"Start: with the first month for which benefits are received.",
kz4:"Interruption: full months without benefits do not count. The waiting period is extended by these months – but it does not start again.",
kz5:"Restart: a new, full 12-month waiting period only applies if no SGB II or SGB XII benefits were received for at least 3 years (36 months) before (§ 22 (1) SGB II, § 35 SGB XII). After a shorter break, only the remaining months of the old waiting period continue.",
kz6:"Afterwards: if the rent is too high, the Jobcenter asks for a cost reduction. Actual costs are then usually covered for at most 6 more months. The same waiting period applies to assets (40,000 € + 15,000 € per additional person).",
kz7:"Moving: anyone who moves into a more expensive flat without approval only gets the previous rent – also during the waiting period.",
kzEx:"Examples: benefits from March 2026 → waiting period until February 2027. If August 2026 is a full month without benefits, it ends in March 2027. If earlier benefits ended in June 2024 and new ones start in May 2026, only 22 months lie in between → no new waiting period, only the remaining months.",
kzCalcH:"Calculate the waiting period for this case",kzStart:"Start of current benefits (month)",kzPrev:"End of earlier benefits (if any)",kzGap:"Full months without benefits since start",kzUsed:"Waiting-period months already used in earlier benefits",
kzNew:"New waiting period: 12 months from {m}.",kzNewGap:"{x} months without benefits have passed since the earlier benefits – at least 36, so the waiting period starts again.",
kzNoNew:"No new waiting period: only {x} months without benefits lie between the earlier benefits and now (required: 36). Only the remaining {r} months continue.",kzUsedHint:"If left empty, the earlier waiting period is assumed to be fully used.",
kzEnd:"The waiting period runs up to and including {m}.",kzExt:"Extended by {x} month(s) without benefits.",kzActive:"Today the waiting period still runs for {x} month(s).",kzOver:"Today the waiting period has ended.",kzNone:"No waiting period is left.",kzFuture:"The waiting period has not started yet.",
kz2023:"The waiting period only exists since 1 Jan 2023. For benefits before that it starts in January 2023 at the earliest.",kzRestart:"A new waiting period would only be possible again after 3 years without benefits from the end of these benefits.",kzSet:"The selection below has been set automatically."},
tr:{kzTitle:"Bekleme süresi (Karenzzeit)",kzWhat:"Kısaca: Bekleme süresi nedir?",
kz1:"Yardım alınan ilk 12 ayda Jobcenter gerçek kirayı öder – kira üst sınırın üzerinde olsa bile. Ancak 01.07.2026'dan beri en fazla kira üst sınırının %150'si.",
kz2:"Isınma giderleri korunmaz. İlk aydan itibaren uygunluk açısından kontrol edilir.",
kz3:"Başlangıç: yardım alınan ilk ay.",
kz4:"Kesinti: Yardımsız geçen tam aylar sayılmaz. Bekleme süresi bu aylar kadar uzar – ama baştan başlamaz.",
kz5:"Yeniden başlama: 12 aylık yeni bir bekleme süresi ancak öncesinde en az 3 yıl (36 ay) SGB II veya SGB XII yardımı alınmamışsa başlar (§ 22 Abs. 1 SGB II, § 35 SGB XII). Daha kısa bir aradan sonra eski bekleme süresinin yalnızca kalan ayları devam eder.",
kz6:"Sonrası: Kira çok yüksekse Jobcenter giderlerin azaltılmasını ister. Gerçek giderler genellikle en fazla 6 ay daha karşılanır. Varlık için de aynı bekleme süresi geçerlidir (40.000 € + her ek kişi için 15.000 €).",
kz7:"Taşınma: Onay almadan daha pahalı bir daireye taşınan kişi yalnızca eski kirayı alır – bekleme süresinde de.",
kzEx:"Örnekler: Mart 2026'dan itibaren yardım → bekleme süresi Şubat 2027'ye kadar. Ağustos 2026 tam bir ay yardımsız geçerse Mart 2027'de biter. Önceki yardım Haziran 2024'te bittiyse ve yenisi Mayıs 2026'da başlarsa arada sadece 22 ay vardır → yeni bekleme süresi yok, sadece kalan aylar.",
kzCalcH:"Bu durum için bekleme süresini hesapla",kzStart:"Mevcut yardımın başlangıcı (ay)",kzPrev:"Önceki yardımın bitişi (varsa)",kzGap:"Başlangıçtan beri yardımsız tam aylar",kzUsed:"Önceki yardımda kullanılmış bekleme ayları",
kzNew:"Yeni bekleme süresi: {m} itibarıyla 12 ay.",kzNewGap:"Önceki yardımdan beri {x} ay yardımsız geçti – en az 36, bu yüzden bekleme süresi baştan başlar.",
kzNoNew:"Yeni bekleme süresi yok: Önceki yardım ile şimdi arasında yalnızca {x} ay yardımsız geçmiş (gerekli: 36). Yalnızca kalan {r} ay devam eder.",kzUsedHint:"Boş bırakılırsa önceki bekleme süresinin tamamen kullanıldığı varsayılır.",
kzEnd:"Bekleme süresi {m} dahil devam eder.",kzExt:"Yardımsız {x} ay kadar uzatıldı.",kzActive:"Bugün bekleme süresinin {x} ayı daha var.",kzOver:"Bugün bekleme süresi sona ermiştir.",kzNone:"Hiç bekleme süresi kalmadı.",kzFuture:"Bekleme süresi henüz başlamadı.",
kz2023:"Bekleme süresi 01.01.2023'ten beri vardır. Daha önceki yardımlarda en erken Ocak 2023'te başlar.",kzRestart:"Yeni bir bekleme süresi ancak bu yardımın bitiminden itibaren 3 yıl yardım alınmazsa mümkün olur.",kzSet:"Aşağıdaki seçim buna göre otomatik ayarlandı."},
ar:{kzTitle:"فترة السماح (Karenzzeit)",kzWhat:"شرح مبسط: ما هي فترة السماح؟",
kz1:"في أول 12 شهرًا من تلقي الإعانة يدفع Jobcenter الإيجار الفعلي – حتى لو تجاوز الحد الأعلى. لكن منذ 01.07.2026 بحد أقصى 150 % من الحد الأعلى للإيجار.",
kz2:"تكاليف التدفئة غير محمية، وتُفحص من الشهر الأول.",
kz3:"البداية: أول شهر تُستلم فيه الإعانة.",
kz4:"الانقطاع: الأشهر الكاملة بدون إعانة لا تُحتسب. تمتد فترة السماح بعدد هذه الأشهر – لكنها لا تبدأ من جديد.",
kz5:"البدء من جديد: لا تبدأ فترة سماح جديدة كاملة مدتها 12 شهرًا إلا إذا لم تُستلم أي إعانات وفق SGB II أو SGB XII لمدة 3 سنوات (36 شهرًا) على الأقل قبلها (§ 22 Abs. 1 SGB II, § 35 SGB XII). بعد انقطاع أقصر تستمر فقط الأشهر المتبقية من فترة السماح القديمة.",
kz6:"بعد ذلك: إذا كان الإيجار مرتفعًا جدًا يطلب Jobcenter خفض التكاليف. تُغطى التكاليف الفعلية عادةً لمدة 6 أشهر إضافية كحد أقصى. تنطبق فترة السماح نفسها على الأصول (40.000 € + 15.000 € لكل شخص إضافي).",
kz7:"الانتقال: من ينتقل دون موافقة إلى شقة أغلى يحصل فقط على الإيجار السابق – حتى خلال فترة السماح.",
kzEx:"أمثلة: إعانة من مارس 2026 ← فترة السماح حتى فبراير 2027. إذا كان أغسطس 2026 شهرًا كاملًا بدون إعانة تنتهي في مارس 2027. إذا انتهت إعانة سابقة في يونيو 2024 وبدأت الجديدة في مايو 2026 فبينهما 22 شهرًا فقط ← لا فترة سماح جديدة، فقط الأشهر المتبقية.",
kzCalcH:"احسب فترة السماح لهذه الحالة",kzStart:"بداية الإعانة الحالية (الشهر)",kzPrev:"نهاية إعانة سابقة (إن وجدت)",kzGap:"الأشهر الكاملة بدون إعانة منذ البداية",kzUsed:"أشهر فترة السماح المستهلكة في الإعانة السابقة",
kzNew:"فترة سماح جديدة: 12 شهرًا ابتداءً من {m}.",kzNewGap:"مرّ {x} شهرًا بدون إعانة منذ الإعانة السابقة – 36 على الأقل، لذلك تبدأ فترة السماح من جديد.",
kzNoNew:"لا فترة سماح جديدة: بين الإعانة السابقة والآن {x} شهرًا فقط بدون إعانة (المطلوب: 36). تستمر فقط الأشهر المتبقية وعددها {r}.",kzUsedHint:"إذا تُرك فارغًا يُفترض أن فترة السماح السابقة استُهلكت بالكامل.",
kzEnd:"تستمر فترة السماح حتى نهاية {m}.",kzExt:"مُددت بمقدار {x} شهر بدون إعانة.",kzActive:"اليوم تبقى من فترة السماح {x} شهر.",kzOver:"اليوم انتهت فترة السماح.",kzNone:"لم يتبقَّ شيء من فترة السماح.",kzFuture:"لم تبدأ فترة السماح بعد.",
kz2023:"توجد فترة السماح منذ 01.01.2023 فقط. للإعانات قبل ذلك تبدأ في يناير 2023 على أقرب تقدير.",kzRestart:"لن تكون فترة سماح جديدة ممكنة إلا بعد 3 سنوات بدون إعانات من نهاية هذه الإعانة.",kzSet:"تم ضبط الاختيار أدناه تلقائيًا بناءً على ذلك."},
uk:{kzTitle:"Пільговий період (Karenzzeit)",kzWhat:"Просто пояснення: що таке пільговий період?",
kz1:"У перші 12 місяців отримання допомоги Jobcenter оплачує фактичну оренду – навіть понад межу оренди. Але з 01.07.2026 щонайбільше 150 % межі оренди.",
kz2:"Опалення не захищене. Його перевіряють на належність з першого місяця.",
kz3:"Початок: перший місяць, за який отримується допомога.",
kz4:"Перерва: повні місяці без допомоги не враховуються. Пільговий період подовжується на ці місяці – але не починається знову.",
kz5:"Новий початок: новий повний 12-місячний пільговий період настає лише тоді, коли перед цим щонайменше 3 роки (36 місяців) не отримувалися виплати за SGB II чи SGB XII (§ 22 Abs. 1 SGB II, § 35 SGB XII). Після коротшої перерви продовжуються лише залишкові місяці старого періоду.",
kz6:"Після цього: якщо оренда завелика, Jobcenter вимагає знизити витрати. Фактичні витрати зазвичай покриваються ще щонайбільше 6 місяців. Для майна діє той самий пільговий період (40 000 € + 15 000 € за кожну наступну особу).",
kz7:"Переїзд: хто без згоди переїжджає в дорожче житло, отримує лише попередню оренду – також у пільговий період.",
kzEx:"Приклади: допомога з березня 2026 → пільговий період до лютого 2027. Якщо серпень 2026 – повний місяць без допомоги, він закінчується в березні 2027. Якщо попередня допомога закінчилася в червні 2024, а нова почалася в травні 2026, між ними лише 22 місяці → нового періоду немає, лише залишкові місяці.",
kzCalcH:"Розрахувати пільговий період для цього випадку",kzStart:"Початок поточної допомоги (місяць)",kzPrev:"Кінець попередньої допомоги (якщо була)",kzGap:"Повні місяці без допомоги від початку",kzUsed:"Уже використані місяці пільгового періоду з попередньої допомоги",
kzNew:"Новий пільговий період: 12 місяців від {m}.",kzNewGap:"Від попередньої допомоги минуло {x} місяців без виплат – щонайменше 36, тому період починається знову.",
kzNoNew:"Нового пільгового періоду немає: між попередньою допомогою і тепер лише {x} місяців без виплат (потрібно: 36). Продовжуються лише залишкові {r} місяців.",kzUsedHint:"Якщо не вказано, вважається, що попередній період повністю використано.",
kzEnd:"Пільговий період триває до {m} включно.",kzExt:"Подовжено на {x} міс. без допомоги.",kzActive:"Сьогодні пільговий період триває ще {x} міс.",kzOver:"Сьогодні пільговий період закінчився.",kzNone:"Пільгового періоду не залишилося.",kzFuture:"Пільговий період ще не розпочався.",
kz2023:"Пільговий період існує лише з 01.01.2023. Для допомоги до цього він починається не раніше січня 2023.",kzRestart:"Новий пільговий період буде можливий лише після 3 років без допомоги від кінця цієї допомоги.",kzSet:"Вибір нижче встановлено автоматично."},
ru:{kzTitle:"Льготный период (Karenzzeit)",kzWhat:"Просто о главном: что такое льготный период?",
kz1:"В первые 12 месяцев получения пособия Jobcenter оплачивает фактическую аренду – даже выше предела аренды. Но с 01.07.2026 не более 150 % предела аренды.",
kz2:"Отопление не защищено. Его проверяют на соразмерность с первого месяца.",
kz3:"Начало: первый месяц, за который получается пособие.",
kz4:"Перерыв: полные месяцы без пособия не засчитываются. Льготный период продлевается на эти месяцы – но не начинается заново.",
kz5:"Новый старт: новый полный 12-месячный льготный период наступает только если перед этим не менее 3 лет (36 месяцев) не получались выплаты по SGB II или SGB XII (§ 22 Abs. 1 SGB II, § 35 SGB XII). После более короткого перерыва продолжаются только оставшиеся месяцы старого периода.",
kz6:"После этого: если аренда слишком высока, Jobcenter требует снизить расходы. Фактические расходы обычно покрываются ещё не более 6 месяцев. Для имущества действует тот же льготный период (40 000 € + 15 000 € за каждого следующего человека).",
kz7:"Переезд: кто без согласия переезжает в более дорогое жильё, получает только прежнюю аренду – и в льготный период тоже.",
kzEx:"Примеры: пособие с марта 2026 → льготный период до февраля 2027. Если август 2026 – полный месяц без пособия, он заканчивается в марте 2027. Если прежнее пособие закончилось в июне 2024, а новое началось в мае 2026, между ними только 22 месяца → нового периода нет, только оставшиеся месяцы.",
kzCalcH:"Рассчитать льготный период для этого случая",kzStart:"Начало текущего пособия (месяц)",kzPrev:"Окончание прежнего пособия (если было)",kzGap:"Полные месяцы без пособия с начала",kzUsed:"Уже использованные месяцы льготного периода из прежнего пособия",
kzNew:"Новый льготный период: 12 месяцев с {m}.",kzNewGap:"С прежнего пособия прошло {x} месяцев без выплат – не менее 36, поэтому период начинается заново.",
kzNoNew:"Нового льготного периода нет: между прежним пособием и сейчас только {x} месяцев без выплат (нужно: 36). Продолжаются только оставшиеся {r} месяцев.",kzUsedHint:"Если не указано, считается, что прежний период полностью использован.",
kzEnd:"Льготный период длится до {m} включительно.",kzExt:"Продлён на {x} мес. без пособия.",kzActive:"Сегодня льготный период длится ещё {x} мес.",kzOver:"Сегодня льготный период закончился.",kzNone:"Льготного периода не осталось.",kzFuture:"Льготный период ещё не начался.",
kz2023:"Льготный период существует только с 01.01.2023. Для пособия до этого он начинается не раньше января 2023.",kzRestart:"Новый льготный период будет возможен только после 3 лет без пособия с конца этого пособия.",kzSet:"Выбор ниже установлен автоматически."}
};

/* Kinderwohngeld: Kinder, deren Bedarf durch Unterhalt/UVG, Kindergeld und Wohngeld gedeckt ist, scheiden aus der
   Bedarfsgemeinschaft aus. Wohngeld für diesen Teilhaushalt: Höchstbetrag nach allen Haushaltsmitgliedern, Miete nach Kopfanteil,
   Einkommen = Unterhalt/UVG der Kinder (Kindergeld zählt nicht). */
function kinderWG(G,H,VL){
  const res={total:0, per:G.kids.map(()=>0), set:[]};
  if(G.regime==="asyl" || G.regime==="none" || H.verm>VL.wg) return res;
  const nT=G.n+G.ext, hb=byN(P.wg.hb,P.wg.hbPlus,nT), kl=byN(P.wg.klima,P.wg.klimaPlus,nT), hke=byN(P.wg.hke,P.wg.hkePlus,nT), hkk=byN(P.wg.hkk,P.wg.hkkPlus,nT);
  const mAll=Math.min(H.mi,hb+kl)+hke+hkk;
  let set=G.kids.map((k,i)=>i).filter(i=>G.kids[i].uh>0);
  for(let it=0; it<6 && set.length; it++){
    const k=set.length, mi6=Math.min(k,6)-1;
    const M=Math.max(mAll*k/nT, P.wg.mMin[mi6]), Y=Math.max(set.reduce((s,i)=>s+G.kids[i].uh,0), P.wg.yMin[mi6]);   /* Anlage 3 WoGG */
    const idx=Math.min(k,12)-1, a=P.wg.a[idx], b=P.wg.b[idx], c=P.wg.c[idx];
    let wg=Math.round(Math.max(0,Math.min(1.15*(M-(a+b*M+c*Y)*Y),M))); if(wg<P.wg.min) wg=0;
    const per=wg/k;
    const keep=set.filter(i=>{ const kd=G.kids[i]; return kd.uh+P.kindergeld+per >= rbKind(kd.age)+G.kopf+G.wwKids[i]; });
    if(keep.length===set.length){ if(wg>0){ res.total=wg; set.forEach(i=>res.per[i]=per); res.set=set.slice(); } return res; }
    set=keep;
  }
  return res;
}
/* Kranken-/Pflegeversicherung außerhalb der Grundsicherung */
function kvCalc(G,H){
  const s=P.sv, k=G.kids.length;
  const pv = k===0 ? s.pv+s.pvKl : s.pv-(k>=2 ? s.pvAb*(Math.min(k,5)-1) : 0);
  const rate = (s.kv+s.zb+pv)/100;
  const base = (a,i)=>{
    if(a.jb>s.minijob) return "job";
    if(a.rb>0 && (G.pers[i].rag || a.ef!=="ja")) return "rente";
    if(a.so>0) return "leist";
    return null;
  };
  const pers = G.ads.map((a,i)=>{
    let auto = base(a,i);
    if(!auto){ const j=1-i; auto = (H.typ==="paar" && H.verh && G.ads[j] && base(G.ads[j],j)) ? "fam" : "frei"; }
    const st = (a.kv && a.kv!=="auto") ? a.kv : auto;
    const basis = Math.max(s.mindest, a.jb+a.rb+a.so);
    const voll = r2(basis*rate);
    return {auto, st, basis, voll, beitrag: st==="frei" ? voll : 0};
  });
  return {pers, rate, pv, total: r2(pers.reduce((x,p)=>x+p.beitrag,0))};
}
/* Karenzzeit (§ 22 Abs. 1 SGB II, § 35 SGB XII):
   12 Monate ab erstem Leistungsmonat (frühestens 01/2023); volle Monate ohne Leistung verlängern sie;
   neu beginnt sie nur nach mindestens 36 Monaten ohne SGB-II/XII-Leistungen, sonst laufen die Restmonate weiter. */
const mIdx = v => { const m=/^(\d{4})-(\d{2})$/.exec(v||""); return m ? (+m[1])*12 + (+m[2]-1) : null; };
const mName = i => new Intl.DateTimeFormat(loc(),{month:"long",year:"numeric"}).format(new Date(Math.floor(i/12), i%12, 1));
function karenz(H){
  const start = mIdx(H.kzStart); if(start==null) return null;
  const prev = mIdx(H.kzPrev), floor = 2023*12, now = YEAR*12+MON-1;
  const pause = prev!=null && prev<start ? start-prev-1 : null;
  const neu = pause==null || pause>=36;
  const used = neu ? 0 : (H.kzUsed==null ? 12 : clamp(H.kzUsed,0,12));
  const rest = 12-used, gap = Math.max(0, Math.floor(H.kzGap||0));
  const eff = Math.max(start, floor);
  const end = eff + rest + gap - 1;
  const active = rest>0 && now>=eff && now<=end;
  return {start, eff, pause, neu, used, rest, gap, end, active, now, before2023: start<floor, usedBlank: !neu && H.kzUsed==null, future: now<eff};
}
function renderKarenz(){

    lines.push('<b>'+esc(k.future?t("kzFuture"):k.active?t("kzActive",{x:k.end-k.now+1}):t("kzOver"))+'</b>');
  }

  lines.push('<span class="kzmeta">'+esc(t("kzRestart"))+'</span>');
  box.innerHTML='<div class="kzbox'+(k.active?'':' no')+'">'+lines.map(x=>'<p>'+x+'</p>').join("")+'</div>';
}

function berechne(H){
  const G=grund(H); SYS=G.sys;
  const VL=vermLimits(G,H), W=wohngeld(G,H,VL), KV=kvCalc(G,H), K=kinderzuschlag(G,H,KV.total,VL);
  const KW=kinderWG(G,H,VL);
  const s0=sgb(G,{kwg:KW.per}), s0kv=sgb(G,{kv:KV.total});
  const idx = famEff(H) ? [0,1,2,3] : [0,1];
  const xs=[null,{wg:W.wg},{kiz:K.perChild},{wg:W.wg,kiz:K.perChild}];
  const has=[true,W.wg>0,K.kiz>0,(W.wg>0||K.kiz>0)];
  const V = xs.map((x,i)=>{
    if(i===0) return {gap:s0.gap, st:s0.gap>0?"gap":"ok", zus:0};
    const g=sgb(G,Object.assign({kv:KV.total},x)).gap, gn=sgb(G,x).gap;
    const st = !has[i] ? "na" : g===0 ? "ok" : (gn===0 ? "zus" : "gap");
    return {gap:g, gapNoKv:gn, st, zus: st==="zus" ? g : 0};
  });
  const sgbAvail = (G.regime==="II"||G.regime==="XII3"||G.regime==="XII4") && H.verm<=VL.sgb;
  const basis = G.ads.reduce((s,a)=>s+a.jn+a.rn+a.so,0)+G.kids.reduce((s,k)=>s+k.uh,0)+G.kids.length*P.kindergeld;
  const top = famEff(H) ? 3 : 1;
  return {G,W,K,KV,KW,VL,s0,s0kv,V,idx,top,sgbAvail,need:G.need,basis};
}

    if(G.regime==="none"){ h=t("vEuH"); tx=t("vEuT"); }
    else { h=t("vVermH"); tx=t("vVermT",{a:eur(S.verm),b:eur(VL.sgb),c:eur(VL.wg)}); }
    tx += " "+I[L].wg+": "+eur(W.wg)+(famEff(S) ? " · "+I[L].kiz+": "+eur(K.kiz) : "");
  }
  else if(s0.gap===0){ cls="warn"; h=t("vNoneH"); tx=famEff(S) ? t("vNoneT",{a:eur(W.wg),b:eur(K.kiz)}) : I[L].wg+": "+eur(W.wg); }
  else if(famEff(S) && ok(1)&&ok(2)){cls="ok";h=t("vEachH");tx=t("vEachT");best=3;}
  else if(ok(1)){cls="ok";h=t("vWgH");tx=t("vWgT")+(famEff(S)&&K.kiz>0?" "+t("alsoKiz"):"");best=1;}
  else if(ok(2)){cls="ok";h=t("vKizH");tx=t("vKizT")+(W.wg>0?" "+t("alsoWg"):"");best=2;}
  else if(ok(3)){cls="ok";h=t("vBothH");tx=t("vBothT");best=3;}
  else {
    const z=idx.filter(i=>i>0 && V[i].st==="zus").sort((a,b)=>V[a].zus-V[b].zus)[0];
    if(z){cls="ok";h=t("vZusH",{v:t("v"+z)});tx=t("vZusT",{a:eur(KV.total),b:eur(V[z].zus)});best=z;}
    else {cls="bad";h=t("vSgbH");tx=famEff(S) ? t("vSgbT",{a:eur(V[3].gap)}) : t("vSgbWgT",{a:eur(V[1].gap)});}
  }
  if(best>0 && G.sys==="II" && !S.stabil){ cls="warn"; tx=t("vNotStableT",{v:t("v"+best)}); h=t("vNotStableH"); }
  LAST = {h, tx, law};
  $("mbarTxt").textContent = h;
  $("verdict").innerHTML='<div class="verdict '+cls+'">'+ICON[cls]+'<div><b>'+esc(h)+'</b><p>'+esc(tx)+'</p>'+(law?'<p class="law">'+esc(law)+'</p>':'')+'</div></div>';

  /* Hinweise */
  const chips=[['sys',t("regimeL",{r:t("rg_"+G.regime)})]];
  if(G.mixed) chips.push(['w',t("warnMixed")]);
  if(G.kid15) chips.push(['w',t("warnKid15")]);
  if(G.umgCnt>0) chips.push(['w', G.wechsel ? t("umgInfoW",{b:G.nKdU,c:eur(G.grenzeTab),d:Math.round(G.umgDays)}) : t("umgInfoT",{a:G.nBase,e:eur(G.mogBase),b:G.nKdU,f:eur(G.mogFull),c:eur(G.grenzeTab),d:Math.round(G.umgDays)})]);
  if(W.umgWg>0) chips.push(['w',t("umgWg",{x:P.kids.wgUmgMin})]);
  if(G.ext>0) chips.push(['w',t("extInfo",{n:G.nKdU,p:pct(G.shareBG)})]);
  if(G.unbornOn) chips.push(['w',t("unbornInfo")]);
  KW.set.forEach(i=>chips.push(['sys',t("kwgInfo",{n:i+1,a:eur(KW.per[i])})]));
  if(S.kdz==="karenz" && G.kids.length && isFinite(G.mieteCap) && S.mi>G.mieteCap) chips.push(['w',t("kidsKz")]);
  G.ads.forEach((a,i)=>{
    if(a.jn>a.jb && a.jb>0) chips.push(['w',t("wNet",{n:i+1})]);
    if(a.rn>a.rb && a.rb>0) chips.push(['w',t("wRente",{n:i+1})]);
    if(!a.gj) chips.push(['w',t("wGj",{n:i+1})]);
  });
  if(!S.mi) chips.push(['w',t("wMiete")]);
  if(S.son.azubi) chips.push(['w',t("warnAzubi")]);
  if(S.son.stat) chips.push(['w',t("warnStat")]);
  if(G.pers.some(p=>p.edge)) chips.push(['w',t("warnRag")]);
  if(W.vermEx) chips.push(['w',t("vWgVerm",{c:eur(VL.wg)})]);
  if(S.mode==="wg" && G.kids.length) chips.push(['sys',t("kizAuto")]);
  $("chips").innerHTML = chips.map(([c,x])=>'<p class="chip '+c+'">'+esc(x)+'</p>').join("");

  $("kpis").innerHTML=
    '<div class="kpi"><span>'+esc(t("kGap"))+'</span><b>'+eur(s0.gap)+'</b></div>'+
    '<div class="kpi kv"><span>'+esc(t("kKv"))+'</span><b>'+eur(KV.total)+'</b></div>'+
    '<div class="kpi wg"><span>'+esc(I[L].wg)+'</span><b>'+eur(W.wg)+'</b></div>'+
    (famEff(S) ? '<div class="kpi kz"><span>'+esc(I[L].kiz)+'</span><b>'+eur(K.kiz)+'</b></div>' : '<div class="kpi"><span>'+esc(t("colNeed"))+'</span><b>'+eur(R.need)+'</b></div>');
  $("legend").innerHTML='<span><i class="seg-own"></i>'+esc(t("legOwn"))+'</span><span><i class="seg-ben"></i>'+esc(famEff(S)?t("legBen"):I[L].wg)+'</span><span><i class="seg-zus"></i>'+esc(t("legZus"))+'</span><span><i class="seg-gap"></i>'+esc(t("legGap"))+'</span>';

  const scale=Math.max(R.need+KV.total,1), w=x=>(100*Math.max(0,x)/scale).toFixed(2)+"%";
  $("vrows").innerHTML=idx.map(i=>{
    const v=V[i]; let own,ben=0,zus=0,gap;
    if(i===0){ own=R.need-s0.gap; gap=s0.gap; }
    else { own=R.need+KV.total-s0kv.gap; ben=Math.max(0,s0kv.gap-v.gap); zus=v.zus; gap=v.gap-zus; }
    let pill;
    if(i===0) pill = v.gap>0?'<span class="pill bad">'+esc(t("pNeedy"))+'</span>':'<span class="pill ok">'+esc(t("pNot"))+'</span>';
    else pill = {ok:'<span class="pill ok">'+esc(t("pOk"))+'</span>',zus:'<span class="pill zus">'+esc(t("pZus"))+'</span>',gap:'<span class="pill bad">'+esc(t("pGap"))+'</span>',na:'<span class="pill na">'+esc(t("pNa"))+'</span>'}[v.st];
    const parts=[];
    if(i===0 && KW.total>0) parts.push(t("kwgAmt",{a:eur(KW.total)}));
    if(i===1) parts.push(W.wg>0?eur(W.wg):(W.vermEx?t("vWgVerm",{c:eur(VL.wg)}):W.unterMin?t("rBelow"):t("rNoWg")));
    if(i===2) parts.push(K.kiz>0?eur(K.kiz):K.reason);
    if(i===3) parts.push(eur(W.wg+K.kiz));
    if(zus>0) parts.push(t("legZus")+" "+eur(zus));
    if(gap>0) parts.push(t("gapW",{x:eur(gap)}));
    const amt=parts.join(" · "), name=t("v"+i);
    return '<div class="vrow'+(i===best?' best':'')+'"><div class="vtop"><b>'+esc(name)+'</b>'+pill+'</div>'+
      '<div class="track" role="img" aria-label="'+esc(name+": "+amt)+'"><div class="seg-own" style="width:'+w(own)+'"></div><div class="seg-ben" style="width:'+w(ben)+'"></div><div class="seg-zus" style="width:'+w(zus)+'"></div><div class="seg-gap" style="width:'+w(gap)+'"></div></div>'+
      '<span class="amt">'+esc(amt)+'</span></div>';
  }).join("");

  const ben = W.wg + (famEff(S) ? K.kiz : 0);
  const sgbB=R.basis+s0.gap+KW.total, vorB=R.basis+ben-KV.total-P.sv.gez+V[top].zus, diff=vorB-sgbB;
  const sub=t("bVorSub",{kv:eur(KV.total),gez:eur(P.sv.gez)})+(V[top].zus>0?" · "+t("bVorZus",{z:eur(V[top].zus)}):"");
  $("budget").innerHTML='<h3>'+esc(t("budgetH"))+'</h3>'+
    '<div class="brow"><span>'+esc(t("bSgb"))+'</span><b>'+eur(sgbB)+'</b></div>'+
    '<div class="brow"><span>'+esc(t(famEff(S)?"bVor":"bVorWg"))+'<small>'+esc(sub)+'</small></span><b>'+eur(vorB)+'</b></div>'+
    '<div class="brow diff"><span>'+esc(t("bDiff"))+'</span><b class="'+(diff>=0?'pos':'neg')+'">'+(diff>=0?'+':'')+eur(diff)+'</b></div>';
  renderWeg(R);
}
function tbl(head, rows, sum){
  const cell=(c,i,tag)=>'<'+tag+(i>0?' class="n"':'')+'>'+(typeof c==="number"?eur(c):esc(c))+'</'+tag+'>';
  return '<div class="tbl"><table><thead><tr>'+head.map((h,i)=>cell(h,i,"th")).join("")+'</tr></thead><tbody>'+
    rows.map(r=>'<tr>'+r.map((c,i)=>cell(c,i,"td")).join("")+'</tr>').join("")+
    (sum?'<tr class="sum">'+sum.map((c,i)=>cell(c,i,"td")).join("")+'</tr>':"")+'</tbody></table></div>';
}
function renderWeg(R){
  const {G,W,K,KV,KW,VL,s0,V,top}=R; let h="";
  h+='<h3>'+esc(t("rw0"))+'</h3>';
  h+='<p class="hint">'+esc(t("regimeL",{r:t("rg_"+G.regime)}))+'<br>'+esc(t("vermR",{a:eur(S.verm),b:eur(VL.sgb),c:eur(VL.wg)}))+'</p>';
  h+='<h3>'+esc(t("rw1"))+'</h3>';
  const r1=[[t("rbP"),G.rbEltern]].concat(G.mbList.map(x=>[x[0],x[1]]));
  r1.push([t("rentR",{g:isFinite(G.mieteCap)?eur(G.mieteCap):t(S.kdz==="senk"?"kdzS":"kdzK")}),G.mieteAnerk],[S.hzG>0&&S.kdz!=="senk"?t("heatRg",{g:eur(S.hzG)}):t("heatR"),G.heatAnerk]);
  if(G.ext>0) r1.push([t("shareR",{p:pct(G.shareBG)}),-(G.kduTotal-G.kdu)]);
  G.kids.forEach((k,i)=>r1.push([t("rbC",{n:i+1,a:k.age}),rbKind(k.age)]));
  if(G.umgNeed>0) r1.push([t("umgR",{d:Math.round(G.umgDays)}),G.umgNeed]);
  h+=tbl([t("colNeed"),t("colEur")],r1,[t("totNeed"),R.need]);
  const r2r=[];
  G.ads.forEach((a,i)=>{ const x=G.inc[i];
    if(a.jb>0||a.jn>0){ const fb=x.xii?x.fbXII:x.fbII; r2r.push([t("earnR",{n:i+1,a:eur(a.jn),b:eur(fb)}),Math.max(0,a.jn-fb)]); }
    if(a.rn>0) r2r.push([t("incRente",{n:i+1,a:eur(a.rn),b:eur(x.gf)}),x.rente]);
    if(a.so>0) r2r.push([t("incSo",{n:i+1}),a.so]);
    if(!x.xii && x.pausch>0) r2r.push([t("pauschR",{n:i+1}),-x.pausch]);
    if(!x.xii && x.uhP>0) r2r.push([t("uhPR",{n:i+1}),-x.uhP]);
    if(x.xii && G.sys==="II") r2r.push([t("xiiPers",{n:i+1}),""]);
  });
  G.kids.forEach((k,i)=>{ if(k.uh>0) r2r.push([t("maintR",{n:i+1}),k.uh]); });
  if(G.kids.length) r2r.push([t("kgR",{n:G.kids.length,a:eur(P.kindergeld)}),G.kids.length*P.kindergeld]);
  if(KW.total>0) r2r.push([t("kwgRow"),KW.total]);
  h+=tbl([t("colInc"),t("colEur")],r2r,[t("gapR"),s0.gap]);
  h+='<p class="hint">'+esc(t("kopf",{a:eur(G.kopf)}))+'</p>';
  h+='<h3>'+esc(t("rw2",{n:G.n}))+'</h3>';
  h+=tbl([t("colM"),t("colEur")],[[t("hbR",{a:eur(W.hb),b:eur(W.kl)}),W.cap],[t("capR"),W.mRent],[t("hkeR"),W.hke],[t("hkkR"),W.hkk]].concat(W.share<1?[[t("shareR",{p:pct(W.share)}),-(W.mRent+W.hke+W.hkk)*(1-W.share)]]:[]),["M",W.M]);
  h+=tbl([t("colY"),t("colGross"),t("colWk"),t("colAfter")],W.rows.concat(W.Yroh<W.Ymin?[[t("yMinR",{a:eur(W.Yroh),b:eur(W.Ymin)}),"","",W.Ymin-W.Yroh]]:[]),[t("yR",{p:pct(W.pa)}),"","",W.Y]);
  if(W.Mroh<W.Mmin) h+='<p class="hint">'+esc(t("mMinR",{a:eur(W.Mroh),b:eur(W.Mmin)}))+'</p>';
  h+='<div class="formula">1,15 · ('+W.M.toFixed(2)+' − ('+W.a+' + '+W.b+'·'+W.M.toFixed(2)+' + '+W.c+'·'+W.Y.toFixed(2)+') · '+W.Y.toFixed(2)+') = '+W.raw.toFixed(2)+' → <b>'+eur(W.wg)+'</b>'+(W.unterMin?' ('+esc(t("rBelow"))+')':'')+(W.vermEx?' – '+esc(t("vWgVerm",{c:eur(VL.wg)})):'')+'</div>';
  if(famEff(S)){
    h+='<h3>'+esc(t("rw3"))+'</h3>';
    if(!K.st) h+='<p class="hint">'+esc(K.reason)+'</p>';
    else { const s=K.st;
      if(s.avg) h+='<p class="hint">'+esc(t("kAvg"))+'</p>';
    h+=tbl([t("colStep"),t("colEur")],[[t("kGross",{a:eur(s.minE)}),s.brutto],[t("kNeed",{p:Math.round(s.anteil*100)}),s.bedarf]].concat(s.kv>0?[[t("kDed"),-s.kv]]:[],[[t("kErw"),s.erw],[t("kOth"),s.oth],[t("kEx"),s.excess],[t("kBase"),s.baseSum],[t("kMinus"),s.exErw>0?-P.kiz.quote*s.exErw:0]].concat(s.exOth>0?[[t("kMinusOth"),-s.exOth]]:[])),[t("kTot"),K.kiz]); }
  }
  h+='<h3>'+esc(t("rw4"))+'</h3>';
  h+=tbl([t("colVar"),t("colGap")],R.idx.map(i=>[t("v"+i)+(V[i].st==="zus"?" ("+t("pZus")+")":""),V[i].gap]));
  h+='<p class="hint">'+esc(t("rw4h"))+'</p>';
  h+='<h3>'+esc(t("rw5"))+'</h3>';
  h+=tbl([t("colItem"),t("colEur")],KV.pers.map((p,i)=>[t("kvP",{n:i+1,s:stName(p.st,p)}),p.beitrag]).concat([[t("gezRow"),P.sv.gez]]));
  h+='<p class="hint">'+esc(t("kvCalc",{a:eur(P.sv.mindest),p:pct(KV.rate)}))+'</p>';
  const ben = W.wg+(famEff(S)?K.kiz:0);
  const sgbB=R.basis+s0.gap+KW.total, vorB=R.basis+ben-KV.total-P.sv.gez+V[top].zus;
  const br=[[t("bBasis"),R.basis,R.basis],[t("bSgbL"),s0.gap,""]].concat(KW.total>0?[[t("kwgRow"),KW.total,""]]:[],[[t(famEff(S)?"bBen":"bBenWg"),"",ben],[t("bKv"),"",-KV.total],[t("bGez"),"",-P.sv.gez]]);
  if(V[top].zus>0) br.push([t("bZus"),"",V[top].zus]);
  h+=tbl([t("colItem"),t("v0"),t("v"+top)],br,[t("bTot"),sgbB,vorB]);
  $("weg").innerHTML=h;
}
function renderParams(){
  const box=$("params"); box.innerHTML="";
  GROUPS.forEach(g=>{
    let items=g.items||[];
    if(g.abc){ items=[]; for(let i=0;i<12;i++) ["a","b","c"].forEach(x=>items.push(["wg."+x+"."+i, x+" · "+(i+1)+" Pers."])); }
    const d=document.createElement("div"); d.className="pg"; d.lang="de"; d.dir="ltr";
    d.innerHTML='<h4>'+esc(g.t)+'</h4><div class="src">Quelle: '+esc(g.src)+'</div>'+(g.warn?'<div class="w">'+esc(g.warn)+'</div>':"")+
      items.map(([p,l])=>{ const v=getP(P,p); return '<div class="pr'+(v!==getP(DEFAULTS,p)?' ch':'')+'"><label for="p_'+p+'">'+esc(l)+'</label><input id="p_'+p+'" data-p="'+p+'" type="text" inputmode="decimal" value="'+String(v).replace(".",",")+'"></div>'; }).join("");
    box.appendChild(d);
  });
  box.querySelectorAll("input[data-p]").forEach(inp=>inp.addEventListener("change",()=>{
    const p=inp.dataset.p, v=num(inp.value); setP(P,p,v);
    inp.parentElement.classList.toggle("ch", v!==getP(DEFAULTS,p));
    try{ localStorage.setItem("vp-wob-params6",JSON.stringify(P)); }catch(e){}
    update();
  }));
}
$("resetP").addEventListener("click",()=>{ P=clone(DEFAULTS); try{ localStorage.removeItem("vp-wob-params6"); }catch(e){} renderParams(); update(); });
$("copyP").addEventListener("click",()=>{
  const txt=JSON.stringify(P,null,2);
  const fb=()=>{ const ta=$("copyBox"); ta.hidden=false; ta.value=txt; ta.select(); $("copyMsg").textContent=t("selectCopy"); };
  try{ navigator.clipboard.writeText(txt).then(()=>{ $("copyMsg").textContent=t("copied"); },fb); }catch(e){ fb(); }
});

/* Ergebnis als Text (für den Vermerk) */
let LAST = {h:"",tx:"",law:""};
function summaryText(){
  const L2 = [];
  const df = new Intl.DateTimeFormat(loc(),{day:"2-digit",month:"2-digit",year:"numeric"}).format(new Date());
  L2.push(t("sumTitle"), t("sumDate",{d:df}), "");
  L2.push(LAST.h, LAST.tx); if(LAST.law) L2.push(LAST.law); L2.push("");
  document.querySelectorAll("#chips .chip").forEach(c=>L2.push("• "+c.textContent));
  L2.push("");
  document.querySelectorAll("#kpis .kpi").forEach(k=>L2.push(k.querySelector("span").textContent+": "+k.querySelector("b").textContent));
  L2.push("");
  document.querySelectorAll("#vrows .vrow").forEach(v=>{ const pill=v.querySelector(".pill"); L2.push(v.querySelector(".vtop b").textContent+" – "+(pill?pill.textContent:"")+" – "+v.querySelector(".amt").textContent); });
  L2.push("");
  document.querySelectorAll("#budget .brow").forEach(r=>{ const sp=r.querySelector("span").cloneNode(true); const sm=sp.querySelector("small"); if(sm) sm.remove(); L2.push(sp.textContent.trim()+": "+r.querySelector("b").textContent); });
  return L2.join("\n");
}
$("copyRes").addEventListener("click",()=>{
  const txt = summaryText();
  const fb=()=>{ const ta=$("copyResBox"); ta.hidden=false; ta.value=txt; ta.select(); $("copyResMsg").textContent=t("selectCopy"); };
  try{ navigator.clipboard.writeText(txt).then(()=>{ $("copyResMsg").textContent=t("copied"); $("copyResBox").hidden=true; },fb); }catch(e){ fb(); }
});
$("mbarBtn").addEventListener("click",()=>{ $("resCard").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"}); });
try{
  const io = new IntersectionObserver(es=>{ es.forEach(e=>{ $("mbar").hidden = e.isIntersecting; }); }, {threshold:0.05});
  io.observe($("resCard"));
}catch(e){}

function renderAll(){ renderLangs(); applyStatic(); rebuild(); showStep(); update(); }
bind(); fillForm(); renderParams(); renderAll();
})();
</script>
